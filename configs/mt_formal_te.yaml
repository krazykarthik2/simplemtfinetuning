# English -> Telugu MT LoRA fine-tuning (formal register)
#
# Base: NLLB-200 distilled (open weights; IndicTrans2 checkpoints are gated).
# Data: real Samanantar En-Te parallel corpus, filtered to the formal Telugu
#       register (news / administrative morpho-syntax). No synthetic data.

base_model: facebook/nllb-200-distilled-600M
src_lang: eng_Latn
tgt_lang: tel_Telu

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, v_proj, k_proj, out_proj]

# data
dataset: samanantar
max_train_samples: 120000
max_eval_samples: 1000
max_src_len: 64
max_tgt_len: 64

# training
output_dir: outputs/mt_formal_te
num_train_epochs: 2
per_device_train_batch_size: 16
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
warmup_steps: 200
weight_decay: 0.0
max_grad_norm: 1.0
fp16: true
bf16: false
logging_steps: 50
eval_steps: 1000
save_steps: 1000
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: bleu
greater_is_better: true
predict_with_generate: true
generation_num_beams: 1
generation_max_length: 64
dataloader_num_workers: 4
gradient_checkpointing: true
seed: 42
report_to: none
